<form [formGroup]="form" class="filters" role="search" aria-label="Filter users">
  <div class="filters__search">
    <label class="sr-only" for="searchInput">Search users</label>
    <div class="filters__search-wrap">
      <svg class="filters__icon" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3a6 6 0 100 12A6 6 0 009 3zM1 9a8 8 0 1114.32 4.906l3.387 3.387a1 1 0 01-1.414 1.414l-3.387-3.387A8 8 0 011 9z" clip-rule="evenodd"/>
      </svg>
      <input
        id="searchInput"
        type="search"
        formControlName="searchQuery"
        class="filters__input"
        placeholder="Search by name, email, username…"
        autocomplete="off"
        aria-label="Search users"
        maxlength="100"
      />
    </div>
  </div>

  <div class="filters__row">
    <div class="filters__field">
      <label class="filters__label" for="genderSelect">Gender</label>
      <select id="genderSelect" formControlName="filterGender" class="filters__select" aria-label="Filter by gender">
        <option value="">All</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="filters__field">
      <label class="filters__label" for="natSelect">Nationality</label>
      <select id="natSelect" formControlName="filterNat" class="filters__select" aria-label="Filter by nationality">
        <option value="">All</option>
        @for (nat of natOptions; track nat) {
          <option [value]="nat">{{ nat }}</option>
        }
      </select>
    </div>

    <div class="filters__field">
      <label class="filters__label">Age range</label>
      <div class="filters__age-range">
        <input
          type="number"
          formControlName="filterAgeMin"
          class="filters__input filters__input--small"
          placeholder="Min"
          min="0"
          max="150"
          aria-label="Minimum age"
        />
        <span class="filters__age-sep">–</span>
        <input
          type="number"
          formControlName="filterAgeMax"
          class="filters__input filters__input--small"
          placeholder="Max"
          min="0"
          max="150"
          aria-label="Maximum age"
        />
      </div>
    </div>

    <div class="filters__field">
      <label class="filters__label">Group by</label>
      <div class="filters__group-btns" role="radiogroup" aria-label="Group users by">
        @for (opt of groupByOptions; track opt.value) {
          <button
            type="button"
            class="filters__group-btn"
            [class.filters__group-btn--active]="form.value.groupBy === opt.value"
            (click)="form.controls['groupBy'].setValue(opt.value)"
            [attr.aria-pressed]="form.value.groupBy === opt.value"
          >{{ opt.label }}</button>
        }
      </div>
    </div>

    @if (hasActiveFilters()) {
      <button
        type="button"
        class="filters__clear"
        (click)="clearFilters()"
        aria-label="Clear all filters"
      >
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
        Clear
      </button>
    }
  </div>
</form>
